name: Deploy to Cloud Run

"on":
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/271750616104/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-deployer@project-16431c48-f329-4f4c-a0c.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: docker build -t asia-south1-docker.pkg.dev/project-16431c48-f329-4f4c-a0c/fruit-store-repo/fruit-store:${{ github.sha }} .

      - name: Push Docker image
        run: docker push asia-south1-docker.pkg.dev/project-16431c48-f329-4f4c-a0c/fruit-store-repo/fruit-store:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fruit-store-app \
            --image=asia-south1-docker.pkg.dev/project-16431c48-f329-4f4c-a0c/fruit-store-repo/fruit-store:${{ github.sha }} \
            --region=asia-south1 \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --set-secrets=JWT_SECRET=jwt-secret:latest