# ============================
# Application
# ============================
#spring.application.name=mandiPrice
server.port=8080

# ============================
# Datasource (H2 in-memory)
# ============================
spring.datasource.url=jdbc:h2:mem:fruitdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================
# JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ============================
# H2 Console
# ============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================
# JWT
# NOTE: this secret is for LOCAL DEVELOPMENT ONLY.
# In a real deployment this must come from an environment variable
# or a secrets manager (e.g. Vault, AWS Secrets Manager) — never committed to source control.
# ============================
jwt.secret=${JWT_SECRET} 
jwt.expiration-ms=3600000

# ============================
# Springdoc / Swagger
# ============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html